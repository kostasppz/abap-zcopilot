name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  java:
    name: Java build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test analyzer-core
        run: mvn -B clean verify

  python:
    name: Python gateway tests & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" ruff
      - name: Lint
        run: ruff check gateway tests
      - name: Tests
        run: pytest -q

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependency audit
        working-directory: ai-gateway
        run: |
          pip install pip-audit
          pip install .
          pip-audit --strict

  tycho:
    name: Eclipse plug-in (Tycho) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build Eclipse modules and p2 repository
        run: mvn -B clean verify -Peclipse
