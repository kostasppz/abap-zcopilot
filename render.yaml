services:
  - type: web
    name: abap-zcopilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: ALLOW_EXTERNAL_PROVIDERS
        value: "true"
      - key: REDACTION_ENABLED
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: OPENAI_API_KEY
        sync: false
      - key: MAX_SOURCE_LENGTH
        value: "200000"
      - key: MAX_FINDINGS
        value: "200"
      - key: MAX_TOKENS
        value: "2048"
